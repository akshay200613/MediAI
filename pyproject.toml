[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medai"
version = "0.1.0"
description = "MedAI – Intelligent Clinic Management System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MedAI Team" }]

dependencies = [
  # Web Framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  # Database
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  # Cache & Sessions
  "redis[hiredis]>=5.0.4",
  # Authentication
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
  # Config
  "pydantic[email]>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  # AI – LiteLLM & LangSmith
  "litellm>=1.40.0",
  "langsmith>=0.1.80",
  "langchain-community>=0.0.38",
  "langchain-litellm>=0.1.0",
  # Vector DB
  "qdrant-client>=1.9.0",
  # RAG & Embeddings
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0.0",
  "pypdf>=4.2.0",
  "python-docx>=1.1.0",
  "unstructured>=0.14.0",
  # Templating
  "jinja2>=3.1.4",
  # HTTP Client
  "httpx>=0.27.0",
  # Logging
  "structlog>=24.2.0",
  # Utilities
  "arrow>=1.3.0",
  "shortuuid>=1.0.13",
  "python-slugify>=8.0.4",
  "langgraph>=1.2.11",
  "langchain-litellm>=0.7.0",
  "fastmcp>=3.4.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "httpx>=0.27.0",
  "faker>=25.8.0",
  "factory-boy>=3.3.0",
  "ruff>=0.4.9",
  "mypy>=1.10.0",
  "pre-commit>=3.7.1",
  "anyio>=4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=core --cov=domains --cov=apps --cov-report=term-missing --cov-report=html:htmlcov"

[tool.hatch.build.targets.wheel]
packages = ["core", "domains", "apps"]
