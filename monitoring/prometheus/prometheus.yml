# Prometheus configuration for MediAI
# Scrapes the FastAPI /metrics endpoint every 15 seconds.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: 'development'
    project: 'medai'

# ── Alerting ──────────────────────────────────────────────────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ── Alert Rules ───────────────────────────────────────────────────────────────
# rule_files:
#   - /etc/prometheus/rules/*.yml

# ── Scrape Configs ────────────────────────────────────────────────────────────
scrape_configs:

  # MedAI FastAPI backend
  - job_name: 'medai_api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'medai-api'
          environment: 'development'
    # If running API in Docker as a service, use the service name instead:
    # static_configs:
    #   - targets: ['api:8000']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
