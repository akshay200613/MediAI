name: CI – Lint, Type Check, Test

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend-quality:
    name: Backend – Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check core/ domains/ apps/ tests/

      - name: Format check with ruff
        run: uv run ruff format --check core/ domains/ apps/ tests/

      - name: Type check with mypy
        run: uv run mypy core/ domains/ apps/
        continue-on-error: true  # Non-blocking until fully typed

  backend-test:
    name: Backend – Tests
    runs-on: ubuntu-latest
    needs: backend-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_serviceos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:testpass@localhost:5432/ai_serviceos_test"
      REDIS_URL: "redis://localhost:6379/1"
      ENVIRONMENT: "development"
      JWT_SECRET_KEY: "test-secret-key-for-ci"
      GOOGLE_API_KEY: "test-key"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest tests/unit/ tests/integration/ -v --cov=core --cov=domains --cov=apps --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend-quality:
    name: Frontend – Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
