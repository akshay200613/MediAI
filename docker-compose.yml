services:
  # ── FastAPI Backend API ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: medai-api:latest
    container_name: medai_api
    restart: unless-stopped
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 280m
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-medai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1" ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [internal, web]

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: medai-postgres:16-alpine-patched
    container_name: medai_postgres
    restart: unless-stopped
    mem_limit: 200m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medai_redis
    restart: unless-stopped
    mem_limit: 40m
    command: redis-server --appendonly yes --maxmemory 30mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Qdrant (Vector DB) ───────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medai_qdrant
    restart: unless-stopped
    mem_limit: 350m
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Caddy (reverse proxy + auto HTTPS) ──────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: medai_caddy
    restart: unless-stopped
    mem_limit: 30m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks: [web]

  # ── Grafana Alloy (forwards /metrics to Grafana Cloud) ──────────────────────
  grafana-agent:
    image: grafana/alloy:latest
    container_name: medai_alloy
    restart: unless-stopped
    mem_limit: 50m
    volumes:
      - ./alloy-config.river:/etc/alloy/config.river
    command: run /etc/alloy/config.river
    networks: [internal, web]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  caddy_data:

networks:
  internal:
  web: