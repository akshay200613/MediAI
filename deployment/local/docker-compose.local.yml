services:
  # ── FastAPI Backend API (built from source) ──────────────────────────────────
  api:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: medai_api
    restart: unless-stopped
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - ../../.env.local          # local secrets only (never the VM's .env)
    environment:
      # Override with Docker service hostnames (not localhost).
      # DATABASE_URL / REDIS_URL are built by settings.py from these parts.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    volumes:
      # Hot-reload: source code changes reflect immediately
      - ../../apps:/app/apps
      - ../../core:/app/core
      - ../../domains:/app/domains
      - mediai_api_uploads:/app/uploads   # reuse existing uploaded files
    networks: [internal, monitoring]

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medai_postgres
    restart: unless-stopped
    env_file:
      - ../../.env.local          # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    ports:
      - "5433:5432"   # 5433 on host to avoid conflict with local Windows PostgreSQL
    volumes:
      - mediai_postgres_data:/var/lib/postgresql/data   # reuse existing data volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medai_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - mediai_redis_data:/data   # reuse existing data volume
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Qdrant (Vector DB) ───────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - mediai_qdrant_data:/qdrant/storage   # reuse existing vector data (medai_knowledge)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks: [internal]

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: medai_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mediai_prometheus_data:/prometheus   # reuse existing metrics history
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [internal, monitoring]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.1
    container_name: medai_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
    volumes:
      - mediai_grafana_data:/var/lib/grafana   # reuse existing dashboards & data
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks: [monitoring]

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile.local
    container_name: medai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000   # used by the browser
      API_INTERNAL_URL: http://api:8000                 # used by Next.js server rewrites
    volumes:
      - ../../apps/frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks: [internal]

volumes:
  # Reference existing named volumes to preserve all data
  mediai_postgres_data:
    external: true
  mediai_redis_data:
    external: true
  mediai_qdrant_data:
    external: true
  mediai_prometheus_data:
    external: true
  mediai_grafana_data:
    external: true
  mediai_api_uploads:
    external: true

networks:
  internal:
  monitoring:
